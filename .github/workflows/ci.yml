name: ci

on:
  push:
    branches: [main]
    # A release tag is the `release` workflow's trigger, not this one's. Without
    # this filter a tag push matches no branch and the whole workflow is
    # skipped, which is the bug this line exists to prevent: a workflow that
    # never runs can never report anything.
    tags-ignore: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node, pnpm, `jj` and `jj-hunk`, shared with `release.yml` so the two
      # cannot drift into running different suites.
      - uses: ./.github/actions/setup

      # `ci` is the whole gate in one command — `vp check` for format, lint and
      # typecheck, the build, the suite, then the package checks — and it is
      # deliberately not spelled out step by step here. A tag runs exactly what a
      # commit runs, and two lists of the same steps drift.
      #
      # The build is inside it for a reason worth keeping: the panel tests read
      # `lib/client.js`, the *built* artifact, because the source and the bundle
      # are two different things and it is the bundle the browser loads. Running
      # the suite without building first would test whatever was built last.
      #
      # The package checks are the tail of the same command, not a step after it.
      # They were repeated here once — `pnpm run ci` finishes with
      # `scripts/check.ts`, and this job then ran the identical command again —
      # which made the one check that sees what a consumer receives the one with
      # a second copy of itself to keep in step.
      - name: Gate (check, build, test, package)
        env:
          # A skip is not a failure. Here the binaries are installed, so a skip
          # would mean the install silently did not happen.
          DSH_JUJUTSU_REQUIRE_TOOLS: "1"
        run: pnpm run ci
