name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Deliberately NOT `id-token: write` here.
  #
  # npm's trusted-publishing documentation, on exactly this shape: "Some GitHub
  # Actions workflows use `workflow_call` to invoke other workflows that run
  # `npm publish`… When this happens, validation checks the calling workflow's
  # name instead of the workflow that actually contains the publish command…
  # The `id-token: write` permission must also be given to both parent and child
  # workflows." The "parent" half is the CALLING JOB below — for a `uses:` job the
  # job's own `permissions:` block is what the called workflow inherits — and
  # `release.yml`'s publish job declares it for itself. A workflow-level grant
  # here would also be inherited by the `release-please` job, which runs a
  # third-party action pinned to a mutable major tag and has no use for OIDC. That
  # job is the wrong place to hold the identity npm trusts, because npm validates
  # THIS filename for the automated path.
  #
  # The naming consequence is not cosmetic either: `release-please.yml` needs its
  # own Trusted Publisher entry on npmjs.com. Registering only `release.yml`
  # leaves the automated path failing authentication while the manual one works.
  #
  # If the automated path ever fails with an authentication error, this is the
  # first thing to try: add `id-token: write` at this level too, and re-check. The
  # job-level grant is the documented mechanism, but no rehearsal can settle it —
  # a dry run skips the `npm publish` that mints the token.

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The tag release-please just created, handed to the publish job below. This
    # is the whole reason the two jobs are wired together in one workflow: the
    # tag is published by the run that made it, not by a second workflow that a
    # `GITHUB_TOKEN` tag would never trigger.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    # Read here because `if` cannot see `secrets`, and this is the only place the
    # token can be read that both steps can then test.
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      # Reads conventional commits (`feat:`, `fix:`, …) since the last tag and
      # opens a version-bump pull request. Merging that PR creates the tag and
      # the GitHub Release, and the `publish` job below ships it.
      #
      # The settings that matter are in `release-please-config.json`, not in the
      # inputs below, because none of them is an action input:
      #
      # - `bump-minor-pre-major` keeps a breaking change on the minor line while
      #   the version is below 1.0.0. Without it a `feat!` proposes 1.0.0, and
      #   this plugin has no business reaching 1.0.0 before the harness it plugs
      #   into leaves 0.x.
      # - `include-component-in-tag: false` keeps tags as `v0.2.0`. The default
      #   prefixes the component (`dsh-jujutsu-v0.2.0`), which matches no
      #   `v*.*.*` filter and so would never fire the publish workflow.
      #
      # `manifest-file` is what puts the action in manifest mode, which is the
      # mode `config-file` requires. It carries one line per package path and is
      # kept in step with the released version by release-please itself.
      #
      # **The PAT is now an upgrade, not a prerequisite.** It used to be load
      # bearing: a tag made with the built-in `GITHUB_TOKEN` triggers no
      # workflow, so release-please on the default token produced a tag that
      # never published — a release that looked cut and was not. The `publish`
      # job below runs in this same workflow run, so that dependency is gone and
      # a release ships on the default token.
      #
      # What the PAT still buys is the release pull request: a PR opened with
      # `GITHUB_TOKEN` does not trigger `ci`, so the version bump would be the
      # one change in the repository that is never tested, and whether the action
      # can open the PR at all depends on the repository's "Allow GitHub Actions
      # to create and approve pull requests" setting. Set the secret if you want
      # the release PR to run CI; without it, prefer the manual release path in
      # CONTRIBUTING.md, which needs no secret at all.
      #
      # `|| github.token` rather than an `if` around the step: `secrets` cannot
      # appear in an `if` — not at the job level and not at the step level — and
      # referencing it there makes GitHub reject the whole file as invalid.
      # Routing it through a job-level `env` is what makes the fallback
      # expressible at all, because `env` *is* available to `if` and to `with`.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ env.RELEASE_PLEASE_TOKEN || github.token }}

      # release-please writes Keep-a-Changelog bullets as `* item`. This repo's
      # formatter normalises them to `- item` unconditionally — there is no
      # setting that makes either accept the other — so the generated CHANGELOG
      # arrives unformatted every time and the release pull request arrives
      # failing the repo's own gate. The first two releases proved it: each
      # needed a separate `fix(changelog): format the … release bullets` commit
      # before the gate would pass.
      #
      # The previous attempt at fixing it here never ran, and neither defect
      # failed loudly — the steps were skipped, and a silently-skipped step looks
      # exactly like a step that worked. Worth naming both:
      #
      # 1. The condition tested `pull_requests_created`. The action's output is
      #    `prs_created`, so the two steps ran zero times and the fix they were
      #    meant to apply landed by hand instead.
      # 2. Nothing checked the repository out. This job's only other step is the
      #    release action, so the workspace was empty: no CHANGELOG.md, no git
      #    history, nothing to push. `GITHUB_HEAD_REF`, which was meant to name
      #    the release PR's branch, is unset on a `push` event regardless.
      #
      # So: check out the release PR's branch, rewrite the bullet character, push
      # it back. The branch name comes from the action's `prs` output, a JSON
      # array of `{ number, title, headBranchName, … }`.
      #
      # Three steps, because each has a distinct failure mode. The rewrite is
      # `sed` on purpose: `vp check --fix` would need a full `pnpm install` in a
      # job that has no Node at all, and it rewrites every Markdown file it can
      # reach rather than the one character this step is aimed at. The rewrite
      # has to come after the checkout, because the file only exists once the
      # branch is on disk, and before the push, because that is where the result
      # leaves the machine.
      #
      # Formatting here is the durable answer. The alternative — waiving the gate
      # for the one file release-please owns — makes the release PR the only PR in
      # the repository allowed to be red, and a rule with an exception is a rule
      # you learn to ignore.
      - name: Check out the release pull request
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.prs)[0].headBranchName }}

      - name: Format the generated changelog
        if: steps.release.outputs.prs_created == 'true'
        run: |
          sed -i -E 's/^\* /- /' CHANGELOG.md
          if grep -q '^\* ' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::star bullets survived the rewrite"
            exit 1
          fi
          echo "dash bullets: $(grep -c '^- ' CHANGELOG.md)"

      - name: Push the formatted changelog
        if: steps.release.outputs.prs_created == 'true'
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md was already formatted"
            exit 0
          fi
          branch="$(git rev-parse --abbrev-ref HEAD)"
          git add CHANGELOG.md
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: format the generated CHANGELOG"
          git push origin "HEAD:refs/heads/$branch"
          echo "pushed to $branch"

  # The publish, in the same run that created the tag.
  #
  # This is `release.yml` called as a reusable workflow, not a second copy of the
  # publish steps. `verify` and `publish` drifted apart once before when the
  # release path was duplicated, and the fix then was to extract the shared
  # setup; this is the same fix one level up.
  publish:
    needs: release-please
    # `release_created` is set only when this run actually cut a release — on the
    # pushes in between, release-please is maintaining its pull request and there
    # is nothing to publish.
    if: needs.release-please.outputs.release_created == 'true'
    # The called workflow publishes through OIDC, and creates a tag/release only
    # on its manual path, which this is not. The scopes must be granted here:
    # a reusable workflow can use only what its caller is allowed to lend it.
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      # Handed to the tag-vs-manifest check inside the called workflow, which
      # refuses to publish a version nobody can match to a commit.
      expected-tag: ${{ needs.release-please.outputs.tag_name }}
