name: release

on:
  push:
    tags: ["v*.*.*"]
  # The tag trigger is the only way this workflow runs in normal use, which means
  # it cannot be exercised until a release is already happening — the worst moment
  # to discover a defect in it. A manual run builds, checks the tag against the
  # manifest and stops before publishing, so the machinery can be tested on
  # purpose rather than during a release.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same setup the commit gate uses. Without it the suite skips every
      # test that drives a real binary, and `verify` passes on a release that
      # tested nothing.
      - uses: ./.github/actions/setup

      # `ci` is the whole gate in one command: typecheck, then `vp check` for
      # format and lint, then the build, then the suite. It is deliberately not
      # spelled out step by step here — a tag should run exactly what a commit
      # runs, and two lists would drift.
      - name: Gate
        env:
          DSH_JUJUTSU_REQUIRE_TOOLS: "1"
        run: pnpm run ci

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing needs this and nothing else: no token is stored
      # in the repository, and provenance is automatic.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or later; the bundled npm for a given
      # Node release is not something this workflow should assume.
      - name: npm is new enough for trusted publishing
        run: |
          version=$(npm --version)
          major=${version%%.*}
          rest=${version#*.}
          minor=${rest%%.*}
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::npm $version is too old for trusted publishing (needs >= 11.5.1)"
            exit 1
          fi
          echo "npm $version"

      # `setup-node` with `registry-url` writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into `.npmrc`. That is
      # right for classic token auth and wrong for OIDC: with the placeholder
      # unexpanded, npm can decide "auth is configured" and never start the token
      # exchange, failing with ENEEDAUTH.
      #
      # Whether it actually breaks is contested — the action's maintainers tested
      # it working with the dummy token present and closed the report, while the
      # issue has 124 cross-references from people it did break. This job has never
      # run and holds `id-token: write`, so it is not the place to bet on a
      # contested behaviour for the sake of one line.
      #
      # See https://github.com/actions/setup-node/issues/1551
      - name: Let npm use OIDC rather than the placeholder token
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            echo "removed the placeholder _authToken line from $npmrc"
          fi

      # A tag that disagrees with the manifest publishes a version nobody can
      # match to a commit, so this is checked before anything is built.
      #
      # The ref arrives through the environment rather than being interpolated
      # into the script text: a tag name may contain `;`, `"`, `$` or a
      # backtick, and this job holds `id-token: write`.
      - name: The tag matches the manifest version
        # A manual run has no tag to compare against.
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::$TAG does not match package.json $expected"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # Trusted publishing: the registry verifies this workflow's OIDC identity,
      # so no secret exists to leak or expire. To set it up, add
      # viztor/dsh-jujutsu + `release.yml` to the package's Trusted Publisher
      # settings on npmjs.com and allow the `npm publish` action.
      #
      # `--ignore-scripts` because the `verify` job already ran the full gate on
      # this same commit; letting `prepublishOnly` run it again would double the
      # work and give a second, differently-timed chance to fail.
      #
      # The `npm view` guard is the only place idempotency belongs: npm refuses
      # to republish a version, so a retried tag has to skip rather than fail.
      # The publish itself is NOT guarded — a swallowed error here once produced
      # a green release for a version that never reached the registry.
      - name: Publish to npmjs (OIDC, provenance)
        # `inputs.dry-run` is unset on a tag push, where the step must run.
        if: inputs.dry-run != true
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "dsh-jujutsu@$version" version 2>/dev/null; then
            echo "$version is already on npmjs, skipping"
          else
            npm publish --provenance --access public --ignore-scripts
          fi

      # The release claim, checked instead of assumed. A successful `npm publish`
      # does not mean the version is readable yet — npm answers "your package is
      # being processed and may take a few minutes to become available", and an
      # immediate `npm view` returns nothing. Checking once reports a healthy
      # release as failed.
      #
      # Eight minutes, because that is what it has taken in practice for an
      # unrelated package of this size. The message names the two things worth
      # knowing: the publish steps above were green, so this is npm still
      # indexing rather than a failed publish; and the command to re-check by
      # hand.
      - name: Dry run — nothing was published
        if: inputs.dry-run == true
        run: |
          echo "::notice::Dry run: the tag check, the build and the package checks all ran; publishing was skipped."

      - name: Verify the published version is readable
        if: inputs.dry-run != true
        run: |
          version=$(node -p "require('./package.json').version")
          attempts=33
          interval=15
          for attempt in $(seq 1 $attempts); do
            if npm view "dsh-jujutsu@$version" version >/dev/null 2>&1; then
              echo "dsh-jujutsu@$version is live on npmjs.org (attempt $attempt/$attempts)"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "attempt $attempt/$attempts: waiting for npm to index dsh-jujutsu@$version"
              sleep $interval
            fi
          done
          echo "::error::dsh-jujutsu@$version is still unreadable after $((attempts * interval - interval))s"
          echo "::error::The publish step above was green, so npm is still processing it rather than having rejected it. Re-check with: npm view dsh-jujutsu@$version version"
          exit 1
