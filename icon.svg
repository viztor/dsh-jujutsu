<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Jujutsu">
  <title>Jujutsu</title>
  <defs>
    <linearGradient id="jj" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#2E9BFF"/>
    </linearGradient>
  </defs>
  <!--
    Two strokes descending into a hook: the "jj" the tool is named for, drawn
    as geometry rather than lettering so it stays legible at the 20px the
    Plugins list renders it at. The trailing stroke is offset and dimmed so the
    pair reads as two revisions rather than one glyph.
  -->
  <g fill="none" stroke="url(#jj)" stroke-width="6.5" stroke-linecap="round">
    <path d="M15 9 V27 a9 9 0 0 1 -9 9"/>
    <path d="M38 9 V27 a9 9 0 0 1 -9 9" opacity="0.55"/>
  </g>
</svg>
